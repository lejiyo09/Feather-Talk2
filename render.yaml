services:
  - type: web
    name: feather-talk2
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      # 서비스 워커는 항상 최신본을 받도록 캐시하지 않는다
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    routes:
      # SPA 라우팅 대비: 알 수 없는 경로는 index.html로
      - type: rewrite
        source: /*
        destination: /index.html
